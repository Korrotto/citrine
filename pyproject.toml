[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citrine-assembler"
version = "1.0.0"
description = "Generic assembler controlled by an architecture file."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karote" }]
keywords = ["assembler", "assembly", "architecture"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Assemblers"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/Korrotto/citrine"


[project.scripts]
citrine = "assembler.__main__:main"

[tool.setuptools.packages.find]
include = ["assembler*"]

[tool.setuptools.package-data]
assembler = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["assembler", "tests"]
target-version = "py313"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "S", "PL", "RUF", "SLOT", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["assembler"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
